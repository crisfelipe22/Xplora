# Production database using environment variables
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=false

# JWT - Production
app.jwt.secret=${APP_JWT_SECRET}

# Mail properties: 
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${XPLORA_MAIL_ADDRESS}
spring.mail.password=${XPLORA_EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
